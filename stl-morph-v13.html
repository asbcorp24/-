<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STL Cosmic Morph v13</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#030713;color:#eef6ff;font:14px system-ui;overflow:hidden}
canvas{display:block}#panel{position:fixed;z-index:4;left:16px;top:16px;width:min(340px,calc(100vw - 32px));padding:17px;background:#101a30e8;border:1px solid #45658a;border-radius:15px;backdrop-filter:blur(12px)}
h2{margin:0 0 12px;font-size:18px}label{display:block;margin:9px 0}input[type=range]{width:100%;accent-color:#4deaff}input[type=text]{width:100%;background:#172942;color:white;border:1px solid #4a6889;border-radius:6px;padding:7px}input[type=number]{width:75px;background:#172942;color:white;border:1px solid #4a6889;border-radius:6px;padding:5px}
button{background:#2269b5;color:white;border:0;border-radius:7px;padding:9px 12px;cursor:pointer;margin:5px 4px 0 0}button:hover{background:#318ddf}
small{color:#b2c8e4}#list{max-height:85px;overflow:auto;color:#b9e8ff;font-size:12px}#status{margin-top:10px;color:#9be9ff}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script></head><body>
<section id="panel"><h2>✦ STL Cosmic Morph v13</h2>
<label>STL-модели (можно несколько) <input id="files" type="file" accept=".stl" multiple></label>
<div id="photoTools"><label>Фото для модели <select id="modelSelect"></select></label><label>Название фигуры (русский текст) <input id="modelTitle" type="text" placeholder="Например: Космический корабль"></label><label>До 4 фотографий <input id="photos" type="file" accept="image/*" multiple></label><div id="photoInfo">Выберите модель</div></div><div id="list">Модели ещё не загружены</div>
<label>Показ фигуры: <b id="showVal">8</b> с <input id="show" type="range" min="2" max="40" value="8"></label>
<label>Фото (каждое): <b id="photoVal">3</b> с <input id="photo" type="range" min="1" max="12" value="3"></label><label>Формирование туннеля: <b id="formVal">3</b> с <input id="form" type="range" min="1" max="10" value="3"></label>
<label>Пролёт туннеля: <b id="flyVal">6</b> с <input id="fly" type="range" min="2" max="20" value="6"></label>
<label>Распад туннеля: <b id="burstVal">2</b> с <input id="burst" type="range" min="1" max="8" value="2"></label>
<label>Скорость вращения <input id="spin" type="range" min="0" max="2" step=".05" value=".25"></label>
<label>Изгиб туннеля <input id="bend" type="range" min="0" max="2.5" step=".1" value="1.1"></label>
<label>Bloom <input id="glow" type="range" min="0" max="3" step=".1" value="1.4"></label>
<button id="start">▶ Старт</button><button id="pause">⏸ Пауза</button><button id="next">⏭ Следующая</button>
<div id="status">Добавьте минимум две модели</div>
<small>Для заранее заданных моделей заполните MODEL_URLS в коде. Список воспроизводится циклически.</small>
</section>
<script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {MeshSurfaceSampler} from 'three/addons/math/MeshSurfaceSampler.js';

// Add as many URLs as needed, e.g. 'models/first.stl', 'models/second.stl'.
const MODEL_URLS=[];
const $=id=>document.getElementById(id);
const val=id=>Number($(id).value);
for(const id of ['show','photo','form','fly','burst'])$(id).oninput=()=>$(id+'Val').textContent=$(id).value;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030713);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.05,500);camera.position.z=4;
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
// Bloom is applied only to layer 1. Photos remain on layer 0.
const BLOOM_LAYER=1;
const darkMaterial=new THREE.MeshBasicMaterial({color:0x000000});
const bloomMaterials=new Map();
// Selective bloom uses the original scene with non-luminous materials temporarily blacked out.
const bloomCamera=camera;
const bloomComposer=new EffectComposer(renderer);
bloomComposer.addPass(new RenderPass(scene,bloomCamera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.4,.65,.14);
bloomComposer.addPass(bloom);
// Keep the bloom result in the offscreen render target for final compositing.
bloomComposer.renderToScreen=false;
const mixPass=new THREE.ShaderMaterial({uniforms:{tDiffuse:{value:null},bloomTexture:{value:null}},vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'uniform sampler2D tDiffuse;uniform sampler2D bloomTexture;varying vec2 vUv;void main(){gl_FragColor=texture2D(tDiffuse,vUv)+texture2D(bloomTexture,vUv);}'});
composer.addPass(new (await import('three/addons/postprocessing/ShaderPass.js')).ShaderPass(mixPass,'tDiffuse'));
composer.passes[1].uniforms.bloomTexture.value=bloomComposer.readBuffer.texture;
composer.addPass(new OutputPass());
scene.add(new THREE.AmbientLight(0xffffff,1));
const loader=new STLLoader(),items=[];
const textureLoader=new THREE.TextureLoader();
let current=0,elapsed=0,playing=false,previous=performance.now();
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const curve=(z,amp)=>{const u=(z+13)/18;return [amp*(.7*Math.sin(u*7)+.3*Math.sin(u*13+1)),amp*(.65*Math.cos(u*6+.7)+.3*Math.sin(u*11))]};
function normalize(g){
 const geo=g.clone();geo.computeBoundingBox();
 const c=geo.boundingBox.getCenter(new THREE.Vector3()),size=geo.boundingBox.getSize(new THREE.Vector3());
 geo.translate(-c.x,-c.y,-c.z);geo.scale(2/Math.max(size.x,size.y,size.z,1e-7),2/Math.max(size.x,size.y,size.z,1e-7),2/Math.max(size.x,size.y,size.z,1e-7));
 geo.computeVertexNormals();return geo;
}
function disposeTitle(item){
 if(!item.titleMesh)return;
 scene.remove(item.titleMesh);
 item.titleMesh.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose()}});
 item.titleMesh.userData.texture?.dispose();
 item.titleMesh=null;
}
function setTitleOpacity(group,opacity){
 group.traverse(o=>{if(o.isMesh)o.material.opacity=opacity});
}
function updateTitle(item){
 disposeTitle(item);
 if(!item.title)return;
 // Canvas uses the browser's Cyrillic-capable fonts, avoiding missing glyphs in Helvetiker.
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
 const font='700 88px "Arial","DejaVu Sans",sans-serif';
 ctx.font=font;
 const width=Math.min(4096,Math.max(512,Math.ceil(ctx.measureText(item.title).width+100)));
 canvas.width=width;canvas.height=150;
 ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.shadowColor='#2ecfff';ctx.shadowBlur=13;
 ctx.lineWidth=3;ctx.strokeStyle='#10365d';ctx.strokeText(item.title,width/2,76);
 ctx.fillStyle='#d5f7ff';ctx.fillText(item.title,width/2,76);
 const tex=new THREE.CanvasTexture(canvas);tex.colorSpace=THREE.SRGBColorSpace;
 const group=new THREE.Group();
 const worldWidth=Math.min(3.3,width/400),worldHeight=worldWidth*canvas.height/width;
 // Several translucent planes form a shallow extruded title in 3D.
 for(let i=0;i<6;i++){
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(worldWidth,worldHeight),
   new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:1,depthWrite:false,side:THREE.DoubleSide}));
  mesh.position.z=i*.009;mesh.layers.enable(BLOOM_LAYER);group.add(mesh);
 }
 group.position.set(0,-1.5,0);group.userData.texture=tex;
 item.titleMesh=group;scene.add(group);
}
$('modelTitle').oninput=()=>{
 const item=items[Number($('modelSelect').value)];if(!item)return;
 item.title=$('modelTitle').value;updateTitle(item);
};
function updatePhotoInfo(){
 const item=items[Number($('modelSelect').value)];
 $('photoInfo').textContent=item?item.photos.length+'/4 фото — '+item.name:'Нет моделей';
 $('modelTitle').value=item?.title||'';
}
$('modelSelect').onchange=updatePhotoInfo;
$('photos').onchange=async e=>{
 const item=items[Number($('modelSelect').value)];if(!item)return;
 const selected=[...e.target.files].slice(0,Math.max(0,4-item.photos.length));
 for(const file of selected){
  const url=URL.createObjectURL(file);
  try{
   const texture=await new Promise((resolve,reject)=>textureLoader.load(url,resolve,undefined,reject));
   texture.colorSpace=THREE.SRGBColorSpace;item.photos.push(texture);
  }catch(err){$('status').textContent='Ошибка фотографии: '+file.name}
  finally{URL.revokeObjectURL(url)}
 }
 e.target.value='';updatePhotoInfo();update(elapsed);
};
function addModel(g,name){
 const geometry=normalize(g);
 const mesh=new THREE.Mesh(geometry,new THREE.MeshBasicMaterial({color:0x6cdfff,wireframe:true,transparent:true,opacity:1,depthWrite:false}));
 mesh.visible=false;scene.add(mesh);
 const sampleCount=10000,points=new Float32Array(sampleCount*3),sampler=new MeshSurfaceSampler(new THREE.Mesh(geometry,new THREE.MeshBasicMaterial())).build(),v=new THREE.Vector3();
 for(let i=0;i<sampleCount;i++){sampler.sample(v);points.set([v.x,v.y,v.z],i*3)}
 mesh.layers.enable(BLOOM_LAYER);
 const item={name,mesh,points,photos:[],title:name.replace(/\\.stl$/i,''),titleMesh:null};items.push(item);updateTitle(item);
 $('modelSelect').innerHTML=items.map((x,i)=>'<option value="'+i+'">'+(i+1)+'. '+x.name.replaceAll('<','&lt;')+'</option>').join('');
 updatePhotoInfo();$('list').textContent=items.map((x,i)=>(i+1)+'. '+x.name).join(' · ');
 $('status').textContent=items.length+' моделей готово';
}
$('files').onchange=async e=>{
 playing=false;
 for(const item of items){if(item.titleMesh)disposeTitle(item);scene.remove(item.mesh);item.mesh.geometry.dispose();item.mesh.material.dispose();for(const tex of item.photos)tex.dispose()}
 items.length=0;current=0;elapsed=0;
 for(const f of e.target.files){try{addModel(loader.parse(await f.arrayBuffer()),f.name)}catch(err){$('status').textContent='Ошибка '+f.name+': '+err.message}}
 update(0);
};
for(const url of MODEL_URLS){loader.load(url,g=>{addModel(g,url);update(0)},undefined,e=>$('status').textContent='Не загружен '+url)}
// Distant stars with independent twinkle phases.
const starsN=2200,starsPos=new Float32Array(starsN*3),starPhase=new Float32Array(starsN);
for(let i=0;i<starsN;i++){
 const radius=35+Math.random()*90,phi=Math.acos(2*Math.random()-1),theta=Math.random()*Math.PI*2;
 starsPos.set([radius*Math.sin(phi)*Math.cos(theta),radius*Math.sin(phi)*Math.sin(theta),radius*Math.cos(phi)-20],i*3);
 starPhase[i]=Math.random()*6.28;
}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.BufferAttribute(starsPos,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xb4d8ff,size:.13,transparent:true,opacity:.75,depthWrite:false}));stars.layers.enable(BLOOM_LAYER);scene.add(stars);
// Star glints and passing meteors.
const meteors=[];
for(let i=0;i<5;i++){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(.006,.06,1.6,5),new THREE.MeshBasicMaterial({color:0x93dbff,transparent:true,opacity:0}));
 m.rotation.z=-.9;m.layers.enable(BLOOM_LAYER);scene.add(m);meteors.push(m);
}
const cubeGroup=new THREE.Group();scene.add(cubeGroup);
const cubeGeo=new THREE.BoxGeometry(2.15,2.15,2.15);
const placeholder=new THREE.MeshBasicMaterial({color:0x13253b,wireframe:true,transparent:true});
const cube=new THREE.Mesh(cubeGeo,Array.from({length:6},()=>placeholder));cubeGroup.add(cube);
const cubeEdges=new THREE.LineSegments(new THREE.EdgesGeometry(cubeGeo),new THREE.LineBasicMaterial({color:0x8feaff}));cubeGroup.add(cubeEdges);
const cubeFaces=[4,0,5,1]; // front, right, back, left
function setCube(item){
 const mats=Array.from({length:6},()=>new THREE.MeshBasicMaterial({color:0x102038,transparent:true,opacity:1}));
 item.photos.forEach((tex,i)=>{mats[cubeFaces[i]].map=tex;mats[cubeFaces[i]].color.set(0xffffff);mats[cubeFaces[i]].needsUpdate=true});
 if(Array.isArray(cube.material))cube.material.forEach(m=>{if(m!==placeholder)m.dispose()});
 cube.material=mats;
}
// Enable bloom on all luminous objects, but never on the photographic cube.
const tunnelGeo=new THREE.CylinderGeometry(1.7,1.7,18,48,72,true);tunnelGeo.rotateX(Math.PI/2);
const base=tunnelGeo.attributes.position.array.slice();
const wall=new THREE.Mesh(tunnelGeo,new THREE.MeshBasicMaterial({color:0x07192d,side:THREE.BackSide,transparent:true,opacity:0,depthWrite:false}));wall.position.z=-4;scene.add(wall);
const wire=new THREE.LineSegments(new THREE.WireframeGeometry(tunnelGeo),new THREE.LineBasicMaterial({color:0x32cfff,transparent:true,opacity:0,depthWrite:false}));wire.position.z=-4;scene.add(wire);
wire.layers.enable(BLOOM_LAYER);
const rings=[];
for(let i=0;i<30;i++){
 const m=new THREE.Mesh(new THREE.TorusGeometry(1.68,.012,5,56),new THREE.MeshBasicMaterial({color:0x8aeaff,transparent:true,opacity:0,depthWrite:false}));
 m.layers.enable(BLOOM_LAYER);scene.add(m);rings.push(m);
}
const pgeo=new THREE.BufferGeometry();pgeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(30000),3));
const formation=new THREE.Points(pgeo,new THREE.PointsMaterial({color:0x72edff,size:.022,transparent:true,opacity:0,depthWrite:false}));formation.layers.enable(BLOOM_LAYER);scene.add(formation);
const fragments=new THREE.Points(pgeo.clone(),new THREE.PointsMaterial({color:0xa6eaff,size:.045,transparent:true,opacity:0,depthWrite:false}));fragments.layers.enable(BLOOM_LAYER);scene.add(fragments);
function bendTunnel(amp){
 const attr=tunnelGeo.attributes.position;
 for(let i=0;i<attr.count;i++){const k=i*3,z=base[k+2],c=curve(z-4,amp);attr.setXYZ(i,base[k]+c[0],base[k+1]+c[1],z)}
 attr.needsUpdate=true;tunnelGeo.computeVertexNormals();
 wire.geometry.dispose();wire.geometry=new THREE.WireframeGeometry(tunnelGeo);
 for(let i=0;i<rings.length;i++){const z=-13+i*18/(rings.length-1),c=curve(z,amp),n=curve(z-.08,amp);
 rings[i].position.set(c[0],c[1],z);rings[i].rotation.set(Math.atan2(c[1]-n[1],.08),-Math.atan2(c[0]-n[0],.08),0)}
}
let lastBend=-1;
function update(time){
 const show=val('show'),form=val('form'),fly=val('fly'),burst=val('burst');
 const a=items[current],dest=items.length>1?items[(current+1)%items.length]:null;
 const photoCount=a?.photos.length||0,photoDuration=photoCount*val('photo')+ (photoCount?2:0);
 const tunnelStart=show+1.4+photoDuration+1.4;
 const total=tunnelStart+form+fly+burst,stage=Math.min(time,total);
 const f=smooth((stage-tunnelStart)/form),flight=smooth((stage-tunnelStart-form)/fly),b=smooth((stage-tunnelStart-form-fly)/burst);
 const amp=val('bend');
 if(lastBend!==amp){bendTunnel(amp);lastBend=amp}
 for(const item of items){item.mesh.visible=false;if(item.titleMesh)item.titleMesh.visible=false}
 if(!a){cubeGroup.visible=false;wall.material.opacity=0;wire.material.opacity=0;formation.material.opacity=0;fragments.material.opacity=0;for(const ring of rings)ring.material.opacity=0;return}
 const phaseTime=Math.min(stage,show),spin=val('spin');
 a.mesh.visible=stage<show+1.4;
 if(a.titleMesh){a.titleMesh.visible=stage<show+1.4;a.titleMesh.position.set(0,-1.5,4*smooth((stage-show)/1.4));setTitleOpacity(a.titleMesh,1-smooth((stage-show)/1.4))}
 const departure=smooth((stage-show)/1.4);
 a.mesh.position.set(0,0,4*departure);
 a.mesh.rotation.set(.12*Math.sin(phaseTime*.35),phaseTime*spin,.1*Math.sin(phaseTime*.3));
 a.mesh.scale.setScalar(1.0+.22*smooth(phaseTime/show));
 a.mesh.material.opacity=1-departure;
 const photoStart=show+1.4;
 const photoLocal=stage-photoStart;
 const cubeVisible=photoCount>0&&photoLocal>=0&&photoLocal<photoDuration+1.4;
 cubeGroup.visible=cubeVisible;
 if(!cubeVisible)cube.userData.model=-1;
 if(cubeVisible){
  if(cube.userData.model!==current){setCube(a);cube.userData.model=current}
  const idx=Math.min(photoCount-1,Math.floor(Math.max(0,photoLocal-1)/val('photo')));
  const angles=[0,-Math.PI/2,-Math.PI,Math.PI/2];
  const index=Math.max(0,idx);
  const prev=Math.max(0,index-1);
  const local=Math.max(0,photoLocal-1-index*val('photo'));
  const rotation=smooth(local/.75);
  cubeGroup.rotation.y=angles[prev]+(angles[index]-angles[prev])*rotation;
  cubeGroup.rotation.x=.08*Math.sin(photoLocal*.6);
  const intro=smooth(photoLocal/.8),outro=smooth((photoLocal-photoDuration)/1.4);
  cubeGroup.scale.setScalar(Math.max(.001,intro*(1-outro)));
  cubeGroup.position.z=outro*3;
 }
 const active=smooth((stage-tunnelStart)/form)*(1-b);
 wall.material.opacity=.98*active;wire.material.opacity=.9*active;
 for(const ring of rings)ring.material.opacity=.6*active;
 formation.material.opacity=Math.sin(Math.PI*f)*.95*(1-b);
 const pos=formation.geometry.attributes.position.array;
 for(let i=0;i<10000;i++){
  const k=i*3,u=i/10000,z=-13+18*u,angle=i*2.399963229728653,c=curve(z,amp);
  const x=c[0]+Math.cos(angle)*1.68,y=c[1]+Math.sin(angle)*1.68;
  pos[k]=a.points[k]+(x-a.points[k])*f;
  pos[k+1]=a.points[k+1]+(y-a.points[k+1])*f;
  pos[k+2]=a.points[k+2]+(z-a.points[k+2])*f;
 }
 formation.geometry.attributes.position.needsUpdate=true;
 // A stationary target is visible ahead before the tunnel breaks apart.
 const end=curve(-13,amp);
 if(dest){dest.mesh.visible=stage>=tunnelStart+form && dest!==a;
 if(dest.titleMesh){dest.titleMesh.visible=stage>=tunnelStart+form;dest.titleMesh.position.set(0,-1.5,0);setTitleOpacity(dest.titleMesh,smooth((stage-tunnelStart-form)/Math.max(1,fly*.4)))}
 dest.mesh.position.set(end[0]*(1-b),end[1]*(1-b),-14*(1-b));
 dest.mesh.rotation.set(0,spin*(stage-tunnelStart-form)*.45*(1-b),0);
 dest.mesh.scale.setScalar(.8+.2*b);
 dest.mesh.material.opacity=smooth((stage-tunnelStart-form)/Math.max(1,fly*.4));}
 const camZ=4-15*flight+15*b;
 const camCenter=curve(camZ,amp),inside=smooth((stage-tunnelStart-form)/Math.max(.1,fly*.12))*(1-b);
 camera.position.set(camCenter[0]*inside,camCenter[1]*inside,camZ);
 const ahead=curve(camZ-3,amp);
 camera.lookAt(ahead[0]*inside,ahead[1]*inside,camZ-3);
 camera.fov=65;camera.updateProjectionMatrix();
 fragments.material.opacity=Math.sin(Math.PI*b)*.9;
 const frag=fragments.geometry.attributes.position.array;
 for(let i=0;i<10000;i++){
  const k=i*3,u=i/10000,z=-13+18*u,angle=i*2.3999632297,c=curve(z,amp);
  const r=1.68+b*(3+3*((i*37)%97)/97);
  frag[k]=c[0]+Math.cos(angle)*r;frag[k+1]=c[1]+Math.sin(angle)*r;frag[k+2]=z+b*((i%13)-6)*.25;
 }
 fragments.geometry.attributes.position.needsUpdate=true;
 $('status').textContent=(current+1)+'/'+items.length+' · '+(stage<show?'Показ фигуры':stage<tunnelStart?'Фотокуб':stage<tunnelStart+form?'Фигура становится туннелем':stage<tunnelStart+form+fly?'Пролёт к следующей фигуре':'Туннель разлетается');
}
function cycleDuration(){return val('show')+1.4+(items[current]?.photos.length?items[current].photos.length*val('photo')+2:0)+1.4+val('form')+val('fly')+val('burst')}
$('start').onclick=()=>{if(items.length<2){$('status').textContent='Нужны минимум две STL-модели';return}playing=true};
$('pause').onclick=()=>playing=false;
$('next').onclick=()=>{if(!items.length)return;current=(current+1)%items.length;elapsed=0;update(0)};
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,.08);previous=now;
 if(playing&&items.length>1){elapsed+=dt;if(elapsed>=cycleDuration()){elapsed%=cycleDuration();current=(current+1)%items.length}update(elapsed)}
 const seconds=now*.001;
 stars.material.opacity=.65+.18*Math.sin(seconds*1.7);
 stars.rotation.y=seconds*.0008;
 meteors.forEach((m,i)=>{const t=(seconds*.23+i*.43)%5;m.material.opacity=t<.14?Math.sin(t/.14*Math.PI)*.8:0;m.position.set(10-30*t,7-14*t,-18-i*6)});
 bloom.strength=val('glow');
 // Darken non-bloom objects for bloom extraction, then restore.
 scene.traverse(obj=>{if(obj.isMesh||obj.isPoints||obj.isLine){if(!obj.layers.isEnabled(BLOOM_LAYER)){bloomMaterials.set(obj.uuid,obj.material);obj.material=darkMaterial}}});
 bloomComposer.render();
 scene.traverse(obj=>{if(bloomMaterials.has(obj.uuid)){obj.material=bloomMaterials.get(obj.uuid);bloomMaterials.delete(obj.uuid)}});
 composer.passes[1].uniforms.bloomTexture.value=bloomComposer.readBuffer.texture;
 composer.render();
}
requestAnimationFrame(animate);update(0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);bloomComposer.setSize(innerWidth,innerHeight)});
</script></body></html>
